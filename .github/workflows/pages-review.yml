name: AIOS Review Page

on:
  push:
    branches:
      - change/t00-hdc-guard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aios-review-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before review deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HDC
        run: python -m pip install -e .

      - name: Validate T00
        run: hdc validate task tasks/T00/task.json

      - name: HDC Guard
        run: |
          hdc guard \
            --task tasks/T00/task.json \
            --root .

      - name: Regression tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build review page
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build review
        run: |
          chmod +x scripts/build-review.sh
          ./scripts/build-review.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload review artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/review

  deploy:
    name: Deploy review page
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy AIOS review
        id: deployment
        uses: actions/deploy-pages@v4
