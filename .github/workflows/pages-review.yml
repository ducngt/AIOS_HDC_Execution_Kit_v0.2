name: AIOS Integrated Review

on:
  push:
    branches:
      - main
      - 'change/aios-integrated-prototype-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aios-integrated-review
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          hdc guard \
            --task tasks/T00/task.json \
            --change change-packages/CP-T00.json \
            --evidence engineering-evidence/EE-T00.json \
            --acceptance acceptance-packages/AP-T00.json \
            --root .

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-review.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/review
      - id: deployment
        uses: actions/deploy-pages@v4
