name: HDC Guard

on:
  push:
    branches:
      - main
      - 'change/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hdc-guard:
    name: Validate HDC
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install HDC
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Show HDC version
        run: hdc version

      - name: Validate T00 contract
        run: |
          hdc validate task tasks/T00/task.json

      - name: Enforce HDC governance
        run: |
          hdc guard \
            --task tasks/T00/task.json \
            --root .

      - name: Run regression suite
        run: |
          python -m unittest discover -s tests -v

      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
